<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Accounting Games 導覽</title>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;   /* 置中 */
    color: #fff;           /* 白字避免背景干擾 */
    background: url("./images/七個選項的底圖.PNG") no-repeat center center fixed;
    background-size: cover;
  }

  h1 {
    margin: 0 auto 2rem auto;
    font-size: 20px;
    color: #ffffff;
    background: rgba(0, 0, 0, 0.5);
    padding: 0.8rem 0;
    border-radius: 8px;
    display: block;
    width: 12em;        /* 與按鈕最小寬度一致 */
    text-align: center;
  }

  ul{
    list-style: none;
    padding: 0; margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
  }

  a{
    display: inline-block;
    text-decoration: none;
    color: #fff;
    background-color: #3498db;
    font-size: 20px;      /* 固定字體大小 */
    padding: 0.9em 1.6em; /* 等比例 padding */
    border-radius: 12px;
    min-width: 12em;      /* 保持按鈕大小一致 */
    text-align: center;
    box-shadow: 0 4px 12px rgba(0,0,0,.3);
    transition: transform .15s ease, background-color .25s ease;
  }
  a:hover{
    background-color: #2980b9;
    transform: translateY(-2px);
  }

  /* 🎵 音符按鈕 */
  #musicBtn {
    position: fixed;
    top: 1rem;
    right: 1rem;
    background: rgba(0,0,0,0.6);
    color: white;
    border: none;
    font-size: 24px;
    padding: 0.6rem 0.9rem;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,.3);
    transition: transform 0.2s, background 0.2s;
    z-index: 1001;
  }
  #musicBtn:hover {
    transform: scale(1.1);
    background: rgba(0,0,0,0.8);
  }

  /* 提示文字 */
  #musicHint {
    position: fixed;
    top: 4.5rem;
    right: 1rem;
    background: rgba(0,0,0,0.7);
    color: #fff;
    padding: 0.5rem 0.8rem;
    border-radius: 8px;
    font-size: 14px;
    opacity: 1;
    transition: opacity 1s ease;
    z-index: 1000;
  }

  @media (max-width: 600px){
    ul{ gap: 0.75rem; }
    a{ width: 100%; min-width: 0; }
  }
</style>
</head>
<body>
  <!-- 背景音樂 -->
  <audio id="bgMusic" preload="auto" loop>
    <source src="./首頁背景音.mp3" type="audio/mpeg">
    您的瀏覽器不支援音樂播放
  </audio>

  <!-- 🎵 小音符按鈕 -->
  <button id="musicBtn" aria-label="播放或暫停背景音樂" title="播放/暫停">🔇</button>
  <!-- 提示文字 -->
  <div id="musicHint" role="status" aria-live="polite">點擊音符播放音樂</div>

  <main>
    <h1>歡迎來到會計項目小遊戲</h1>
    <ul>
      <li><a href="./game1/" target="_blank" rel="noopener">費損</a></li>
      <li><a href="./game2/" target="_blank" rel="noopener">資產</a></li>
      <li><a href="./game3/" target="_blank" rel="noopener">收益</a></li>
      <li><a href="./game4/" target="_blank" rel="noopener">負債</a></li>
      <li><a href="./game5/" target="_blank" rel="noopener">流動資產</a></li>
      <li><a href="./game6/" target="_blank" rel="noopener">非流動資產</a></li>
      <li><a href="./game7/" target="_blank" rel="noopener">營業費用</a></li>
    </ul>
  </main>

  <script>
    const musicBtn  = document.getElementById("musicBtn");
    const bgMusic   = document.getElementById("bgMusic");
    const musicHint = document.getElementById("musicHint");

    let isPlaying  = false; // 目前是否在播放
    let wasPlaying = false; // 離開前是否在播放（用於回來時自動恢復）

    function updateIcon() {
      musicBtn.textContent = isPlaying ? "🎵" : "🔇";
    }

    function playMusic() {
      const p = bgMusic.play();
      if (p && typeof p.catch === "function") {
        // 某些瀏覽器可能仍因策略阻擋；失敗就不更動狀態
        p.then(() => {
          isPlaying = true;
          updateIcon();
          hideHint();
        }).catch(() => {/* 忽略錯誤 */});
      } else {
        isPlaying = true;
        updateIcon();
        hideHint();
      }
    }

    function pauseMusic() {
      if (!bgMusic.paused) bgMusic.pause();
      isPlaying = false;
      updateIcon();
    }

    function hideHint() {
      if (musicHint && musicHint.style.display !== "none") {
        musicHint.style.opacity = "0";
        setTimeout(() => musicHint.style.display = "none", 1000);
      }
    }

    // 點擊按鈕：播放/暫停
    musicBtn.addEventListener("click", () => {
      if (isPlaying) {
        pauseMusic();
        wasPlaying = false;  // 使用者主動關閉，回來也不自動播
      } else {
        playMusic();
        wasPlaying = true;   // 使用者主動開啟，離開再回來可自動播
      }
    });

    // 分頁可視狀態改變（切到別分頁/最小化 -> 暫停；回到分頁 -> 若先前在播則恢復）
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        wasPlaying = isPlaying;
        pauseMusic();
      } else {
        if (wasPlaying) playMusic();
      }
    });

    // 視窗焦點（blur 暫停、focus 若先前在播則恢復）
    window.addEventListener("blur", () => {
      wasPlaying = isPlaying;
      pauseMusic();
    });
    window.addEventListener("focus", () => {
      if (wasPlaying) playMusic();
    });

    // 同分頁導向離開時暫停
    window.addEventListener("beforeunload", pauseMusic);
    window.addEventListener("pagehide",     pauseMusic);

    // 點擊任何連結（含 target="_blank"）先暫停
    document.addEventListener("click", (e) => {
      const a = e.target.closest("a");
      if (a && a.href) {
        wasPlaying = isPlaying; // 若是從播放狀態出去，回到此分頁可恢復
        pauseMusic();
      }
    });
  </script>
</body>
</html>
