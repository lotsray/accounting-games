<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: url("./images/七個選項的底圖.PNG") no-repeat center center fixed;
    background-size: cover;
    color: #333;
    text-align: center;
    margin: 0;
    padding: 2rem;
  }
  h1 {
    color: #2c3e50;
    font-size: 20px; /* 固定20號字 */
    margin-bottom: 2rem;
  }
  ul {
    list-style: none;
    padding: 0;
    max-width: 600px;
    margin: 0 auto;
  }
  li {
    margin: 1.5rem 0;
  }
  a {
    display: inline-block;
    text-decoration: none;
    color: white;
    background-color: #3498db;
    font-size: 20px;   /* 固定字體大小 */
    padding: 0.8em 2em; /* 用 em，隨字體比例放大按鈕 */
    border-radius: 12px;
    transition: background-color 0.3s ease, transform 0.2s ease;
  }
  a:hover {
    background-color: #2980b9;
    transform: scale(1.05); /* hover 時放大 */
  }
  @media (max-width: 600px) {
    body {
      padding: 1rem;
    }
    h1 {
      font-size: 20px; /* 手機也固定20號字 */
    }
    a {
      width: 100%;
      box-sizing: border-box;
      font-size: 20px; /* 手機字體固定20號字 */
      padding: 1em 2em; /* 按鈕仍然等比例 */
    }
  }
</style>
