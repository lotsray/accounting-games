<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: url("./images/七個選項的底圖.PNG") no-repeat center center fixed;
    background-size: cover;
    color: #333;
    text-align: center;
    margin: 0;
    padding: 2rem;
  }
  h1 {
    color: #2c3e50;
    font-size: 3rem; /* 放大標題字體 */
    margin-bottom: 2rem;
  }
  ul {
    list-style: none;
    padding: 0;
    max-width: 500px; /* 稍微放大區塊 */
    margin: 0 auto;
  }
  li {
    margin: 1.2rem 0;
  }
  a {
    display: inline-block;
    text-decoration: none;
    color: white;
    background-color: #3498db;
    padding: 1rem 2rem; /* 放大按鈕區域 */
    border-radius: 12px;
    font-size: 1.5rem;  /* 放大按鈕字體 */
    transition: background-color 0.3s ease;
  }
  a:hover {
    background-color: #2980b9;
  }
  @media (max-width: 600px) {
    body {
      padding: 1rem;
    }
    h1 {
      font-size: 2rem;
    }
    a {
      width: 100%;
      box-sizing: border-box;
      font-size: 1.2rem; /* 手機上適中大小 */
      padding: 0.8rem 1.5rem;
    }
  }
</style>
