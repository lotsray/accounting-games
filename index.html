<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Accounting Games 導覽</title>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;  
    color: #fff;          
    background: url("./images/七個選項的底圖.PNG") no-repeat center center fixed;
    background-size: cover;
  }

  h1 {
    margin: 0 auto 2rem auto;
    font-size: 20px;
    color: #ffffff;
    background: rgba(0, 0, 0, 0.5);
    padding: 0.8rem 0;
    border-radius: 8px;
    display: block;
    width: 12em;        
    text-align: center; 
  }

  ul {
    list-style: none;
    padding: 0; margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
  }

  a {
    display: inline-block;
    text-decoration: none;
    color: #fff;
    background-color: #3498db;
    font-size: 20px;      
    padding: 0.9em 1.6em; 
    border-radius: 12px;
    min-width: 12em;      
    text-align: center;
    box-shadow: 0 4px 12px rgba(0,0,0,.3);
    transition: transform .15s ease, background-color .25s ease;
  }
  a:hover {
    background-color: #2980b9;
    transform: translateY(-2px);
  }

  /* 🎵 音符按鈕 */
  #musicBtn {
    position: fixed;
    top: 1rem;
    right: 1rem;
    background: rgba(0,0,0,0.6);
    color: white;
    border: none;
    font-size: 24px;
    padding: 0.6rem 0.9rem;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,.3);
    transition: transform 0.2s;
    z-index: 1001;
  }
  #musicBtn:hover {
    transform: scale(1.1);
    background: rgba(0,0,0,0.8);
  }

  /* 提示文字 */
  #musicHint {
    position: fixed;
    top: 4.5rem;
    right: 1rem;
    background: rgba(0,0,0,0.7);
    color: #fff;
    padding: 0.5rem 0.8rem;
    border-radius: 8px;
    font-size: 14px;
    opacity: 1;
    transition: opacity 1s ease;
    z-index: 1000;
  }

  @media (max-width: 600px) {
    ul { gap: 0.75rem; }
    a { width: 100%; min-width: 0; }
  }
</style>
</head>
<body>
  <!-- 背景音樂 -->
  <audio id="bgMusic" loop>
    <source src="./首頁背景音.mp3" type="audio/mpeg">
    您的瀏覽器不支援音樂播放
  </audio>

  <!-- 🎵 小音符按鈕 -->
  <button id="musicBtn">🎵</button>
  <!-- 提示文字 -->
  <div id="musicHint">點擊音符播放音樂</div>

  <main>
    <h1>歡迎來到會計項目小遊戲</h1>
    <ul>
      <li><a href="./game1/" target="_blank" rel="noopener">費損</a></li>
      <li><a href="./game2/" target="_blank" rel="noopener">資產</a></li>
      <li><a href="./game3/" target="_blank" rel="noopener">收益</a></li>
      <li><a href="./game4/" target="_blank" rel="noopener">負債</a></li>
      <li><a href="./game5/" target="_blank" rel="noopener">流動資產</a></li>
      <li><a href="./game6/" target="_blank" rel="noopener">非流動資產</a></li>
      <li><a href="./game7/" target="_blank" rel="noopener">營業費用</a></li>
    </ul>
  </main>

  <script>
    const musicBtn = document.getElementById("musicBtn");
    const bgMusic = document.getElementById("bgMusic");
    const musicHint = document.getElementById("musicHint");
    let isPlaying = false;

    musicBtn.addEventListener("click", () => {
      if (isPlaying) {
        bgMusic.pause();
        isPlaying = false;
        musicBtn.textContent = "🔇";  
      } else {
        bgMusic.play();
        isPlaying = true;
        musicBtn.textContent = "🎵";  

        // 第一次播放後隱藏提示
        if (musicHint) {
          musicHint.style.opacity = "0";
          setTimeout(() => musicHint.style.display = "none", 1000);
        }
      }
    });
  </script>
</body>
</html>
