<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: url("./images/七個選項的底圖.PNG") no-repeat center center fixed;
    background-size: cover;
    color: #333;
    text-align: center;
    margin: 0;
    padding: 2rem;
  }
  h1 {
    color: #2c3e50;
    font-size: 20px; /* 標題字體固定為20號字 */
    margin-bottom: 2rem;
  }
  ul {
    list-style: none;
    padding: 0;
    max-width: 600px;
    margin: 0 auto;
  }
  li {
    margin: 1.2rem 0;
  }
  a {
    display: inline-block;
    text-decoration: none;
    color: white;
    background-color: #3498db;
    padding: 0.8rem 1.5rem; 
    border-radius: 10px;
    font-size: 20px;  /* 按鈕字體固定為20號字 */
    transition: background-color 0.3s ease;
  }
  a:hover {
    background-color: #2980b9;
  }
  @media (max-width: 600px) {
    body {
      padding: 1rem;
    }
    h1 {
      font-size: 20px; /* 手機維持20號字 */
    }
    a {
      width: 100%;
      box-sizing: border-box;
      font-size: 20px; /* 手機維持20號字 */
      padding: 0.8rem 1.2rem;
    }
  }
</style>
