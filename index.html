<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Accounting Games 導覽</title>
<style>
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;  /* 置中 */
    color: #fff;          /* 改成白字以避免背景干擾 */
    background: url("./images/七個選項的底圖.PNG") no-repeat center center fixed;
    background-size: cover;
  }

  h1 {
  margin-bottom: 2rem;
  font-size: 20px;
  color: #ffffff;                     /* 白字 */
  background: rgba(0, 0, 0, 0.5);     /* 半透明黑底 */
  padding: 0.6rem 1.2rem;
  border-radius: 8px;
  display: inline-block;              /* 背景只包文字 */
  text-align: center;                 /* 文字置中 */
  margin-left: auto;                  /* 讓 h1 本身 */
  margin-right: auto;                 /* 在父容器中置中 */
}



  ul{
    list-style: none;
    padding: 0; margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
  }

  a{
    display: inline-block;
    text-decoration: none;
    color: #fff;
    background-color: #3498db;
    font-size: 20px;      /* 固定字體大小 */
    padding: 0.9em 1.6em; /* 等比例 padding */
    border-radius: 12px;
    min-width: 12em;      /* 保持按鈕大小一致 */
    text-align: center;
    box-shadow: 0 4px 12px rgba(0,0,0,.3);
    transition: transform .15s ease, background-color .25s ease;
  }
  a:hover{
    background-color: #2980b9;
    transform: translateY(-2px);
  }

  @media (max-width: 600px){
    ul{ gap: 0.75rem; }
    a{ width: 100%; min-width: 0; }
  }
</style>
</head>
<body>
  <main>
    <h1>歡迎來到會計項目小遊戲！</h1>
    <ul>
      <li><a href="./game1/" target="_blank" rel="noopener">費損</a></li>
      <li><a href="./game2/" target="_blank" rel="noopener">資產</a></li>
      <li><a href="./game3/" target="_blank" rel="noopener">收益</a></li>
      <li><a href="./game4/" target="_blank" rel="noopener">負債</a></li>
      <li><a href="./game5/" target="_blank" rel="noopener">流動資產</a></li>
      <li><a href="./game6/" target="_blank" rel="noopener">非流動資產</a></li>
      <li><a href="./game7/" target="_blank" rel="noopener">營業費用</a></li>
    </ul>
  </main>
</body>
</html>
